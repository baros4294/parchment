# Gradle & Kotlin Multiplatform settings
# Each build is one short batch job (no daemon): the parallel collector costs less CPU than G1 plus string deduplication.
org.gradle.jvmargs=-Xmx2560m -XX:+UseParallelGC -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin Multiplatform
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36
