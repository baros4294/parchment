name: Build Android APK & Windows EXE Installer

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android .APK (Universal / Android 16)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Self-Signed Release Keystore (if not provided via secrets)
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/parchment-release.jks" \
            -alias parchment \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass parchment123 \
            -keypass parchment123 \
            -dname "CN=Parchment, OU=AI, O=Parchment, L=Local, S=NA, C=US"

      - name: Build Signed Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/parchment-release.jks
          ANDROID_KEYSTORE_PASSWORD: parchment123
          ANDROID_KEY_ALIAS: parchment
          ANDROID_KEY_PASSWORD: parchment123
        run: |
          chmod +x ./gradlew
          ./gradlew :composeApp:assembleRelease --no-daemon

      - name: Rename APK for Clean Download
        run: |
          mkdir -p dist
          cp composeApp/build/outputs/apk/release/*.apk dist/Parchment-Android-Universal.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parchment-Android-APK
          path: dist/Parchment-Android-Universal.apk
          if-no-files-found: error

  build-windows-exe:
    name: Build Windows .EXE Installer (Zero-Trace Uninstall)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Build Native Windows Distributable Runtime
        run: |
          .\gradlew.bat :composeApp:createDistributable --no-daemon

      - name: Package Minimal Zero-Trace .EXE Installer with Inno Setup
        run: |
          iscc.exe installer\windows-installer.iss

      - name: Upload Windows EXE Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parchment-Windows-EXE-Installer
          path: build/installer/Parchment-Windows-x64-Setup.exe
          if-no-files-found: error

  publish-github-release:
    name: Publish Release Assets (on version tag)
    needs: [build-android-apk, build-windows-exe]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: Parchment-Android-APK
          path: release-assets

      - name: Download Windows EXE Installer Artifact
        uses: actions/download-artifact@v4
        with:
          name: Parchment-Windows-EXE-Installer
          path: release-assets

      - name: Create GitHub Release with APK & EXE
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/Parchment-Android-Universal.apk
            release-assets/Parchment-Windows-x64-Setup.exe
          generate_release_notes: true
