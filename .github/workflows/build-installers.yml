name: Build Android APK & Windows EXE Installer

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android .APK (Universal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Accept Android SDK Licenses
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null || true
          fi

      - name: Build Signed Release APK (with OTA-consistent keystore)
        run: |
          APP_VER="2.0.${{ github.run_number }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            APP_VER="${GITHUB_REF#refs/tags/v}"
          fi
          chmod +x ./gradlew
          ./gradlew :composeApp:assembleRelease \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -PappVersion="$APP_VER" \
            -PappVersionCode="$((200 + ${{ github.run_number }}))" \
            -PgithubRepo="${{ github.repository }}" \
            --no-daemon

      - name: Rename APK for Clean Download
        run: |
          mkdir -p dist
          cp composeApp/build/outputs/apk/release/*.apk dist/Parchment-Android-Universal.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parchment-Android-APK
          path: dist/Parchment-Android-Universal.apk
          if-no-files-found: error

  build-windows-exe:
    name: Build Windows .EXE Installer (Zero-Trace Uninstall & Silent OTA)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Build Native Windows Distributable Runtime
        shell: pwsh
        run: |
          $appVer = "2.0.${{ github.run_number }}"
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $appVer = "${{ github.ref }}".Substring(11)
          }
          .\gradlew.bat :composeApp:createDistributable `
            -PappVersion="$appVer" `
            -PappVersionCode="${{ github.run_number }}" `
            -PgithubRepo="${{ github.repository }}" `
            --no-daemon

      - name: Package Minimal Zero-Trace .EXE Installer with Inno Setup
        shell: pwsh
        run: |
          $appVer = "2.0.${{ github.run_number }}"
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $appVer = "${{ github.ref }}".Substring(11)
          }
          iscc.exe "/DMyAppVersion=$appVer" installer\windows-installer.iss

      - name: Upload Windows EXE Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parchment-Windows-EXE-Installer
          path: build/installer/Parchment-Windows-x64-Setup.exe
          if-no-files-found: error

  publish-github-release:
    name: Publish OTA Release Assets (.APK & .EXE)
    needs: [build-android-apk, build-windows-exe]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Determine Release Tag
        id: rel
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v2.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: Parchment-Android-APK
          path: release-assets

      - name: Download Windows EXE Installer Artifact
        uses: actions/download-artifact@v4
        with:
          name: Parchment-Windows-EXE-Installer
          path: release-assets

      - name: Create or Update GitHub Release for In-App OTA Updater
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: "Parchment ${{ steps.rel.outputs.tag }} — Horizon"
          files: |
            release-assets/Parchment-Android-Universal.apk
            release-assets/Parchment-Windows-x64-Setup.exe
          generate_release_notes: true
