name: Build Android APK & Windows EXE Installer

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      reuse_android_run:
        description: "Windows only: ID of the run whose APK to reuse. The release keeps that run's version. Leave empty for a full build."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Branch builds are VERSION_LINE.<run number - VERSION_BASE_RUN>: run 73 is 2.1.0, run 74 is 2.1.1.
# Earlier runs keep 2.0.<run number>, so a Windows-only rebuild reusing one still matches its APK.
# The Android version code stays 200 + run number, so it only ever grows.
env:
  VERSION_LINE: "2.1"
  VERSION_BASE_RUN: "73"

jobs:
  build-android-apk:
    name: Build Android .APK (Universal)
    if: ${{ !inputs.reuse_android_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      - name: Accept Android SDK Licenses
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null || true
          fi

      - name: Stage Private Release Signer
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 .github/scripts/test_stage_android_signing.py
          python3 .github/scripts/stage_android_signing.py

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          if (( GITHUB_RUN_NUMBER >= VERSION_BASE_RUN )); then
            APP_VER="$VERSION_LINE.$((GITHUB_RUN_NUMBER - VERSION_BASE_RUN))"
          else
            APP_VER="2.0.$GITHUB_RUN_NUMBER"
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            APP_VER="${GITHUB_REF#refs/tags/v}"
          fi
          [[ "$APP_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release version"; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            BUILD_VARIANT=debug
            BUILD_TASK=:androidApp:assembleDebug
          else
            BUILD_VARIANT=release
            BUILD_TASK=:androidApp:assembleRelease
          fi
          echo "ANDROID_BUILD_VARIANT=$BUILD_VARIANT" >> "$GITHUB_ENV"
          chmod +x ./gradlew
          python3 .github/scripts/test_run_gradle.py
          python3 .github/scripts/run_gradle.py -- "$BUILD_TASK" \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -PappVersion="$APP_VER" \
            -PappVersionCode="$((200 + GITHUB_RUN_NUMBER))" \
            -PgithubRepo="$GITHUB_REPOSITORY" \
            -PofficialRelease=true \
            --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process

      - name: Rename APK for Clean Download
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/"$ANDROID_BUILD_VARIANT"/*.apk dist/Parchment-Android-Universal.apk
          # R8 renames classes, so a release's crash reports can only be read with its own mapping file.
          if [[ "$ANDROID_BUILD_VARIANT" == release ]]; then
            cp androidApp/build/outputs/mapping/release/mapping.txt dist/Parchment-Android-R8-mapping.txt
          fi

      # The SBOM lists every library in the app (CycloneDX). It never blocks a release: if the plugin can't run,
      # the release ships without it and this step shows the error.
      - name: Generate SBOM
        if: ${{ github.event_name != 'pull_request' }}
        continue-on-error: true
        run: |
          ./gradlew --init-script .github/scripts/sbom.init.gradle.kts cyclonedxBom --no-daemon --no-configuration-cache -PappVersion=0.0.0
          SBOM=$(find build composeApp/build androidApp/build -path '*cyclonedx*' -name '*.json' 2>/dev/null | head -1)
          [[ -n "$SBOM" ]] && cp "$SBOM" dist/Parchment-SBOM.cdx.json

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Parchment-Android-APK
          path: |
            dist/Parchment-Android-Universal.apk
            dist/Parchment-Android-R8-mapping.txt
            dist/Parchment-SBOM.cdx.json
          if-no-files-found: error

      - name: Remove Staged Private Signer
        if: always() && github.event_name != 'pull_request'
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          value = os.environ.get('ANDROID_KEYSTORE_PATH')
          if value:
              target = Path(value).resolve()
              target.relative_to(Path(os.environ['RUNNER_TEMP']).resolve())
              if not target.parent.name.startswith('parchment-signing-'):
                  raise ValueError('Unexpected signer staging directory')
              target.unlink(missing_ok=True)
              target.parent.rmdir()
          PY

  build-windows-exe:
    name: Build Windows .EXE Installer (Zero-Trace Uninstall & Silent OTA)
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    outputs:
      build_number: ${{ steps.build.outputs.number }}
    steps:
      - name: Resolve Build Number
        id: build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse_android_run }}
        run: |
          # A reused APK carries its own run's version, so the installer and release must match it.
          $number = $env:GITHUB_RUN_NUMBER
          if ($env:REUSE_RUN) {
            if ($env:REUSE_RUN -notmatch '^\d+$') { throw "reuse_android_run must be a run ID" }
            if ($env:GITHUB_REF.StartsWith("refs/tags/")) { throw "Reusing an APK is for branch runs only" }
            $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:REUSE_RUN" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Could not read run $env:REUSE_RUN" }
            if ($run.path -ne ".github/workflows/build-installers.yml") { throw "Run $env:REUSE_RUN is not an installer build" }
            $number = $run.run_number
          }
          "number=$number" >> $env:GITHUB_OUTPUT

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      - name: Verify Regressions and Build Windows Runtime
        shell: pwsh
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: |
          $number = [int]$env:BUILD_NUMBER
          $base = [int]$env:VERSION_BASE_RUN
          $appVer = if ($number -ge $base) { "$env:VERSION_LINE.$($number - $base)" } else { "2.0.$number" }
          if ($env:GITHUB_REF.StartsWith("refs/tags/v")) {
            $appVer = $env:GITHUB_REF.Substring(11)
          }
          if ($appVer -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version" }
          $appCode = 200 + [int]$env:BUILD_NUMBER
          python .github/scripts/test_run_gradle.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_workflow_tools.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/quality.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/run_gradle.py -- :composeApp:desktopTest :composeApp:createReleaseDistributable `
            "-PappVersion=$appVer" `
            "-PappVersionCode=$appCode" `
            "-PgithubRepo=$env:GITHUB_REPOSITORY" `
            '-PofficialRelease=true' `
            --no-daemon --max-workers=2 '-Pkotlin.compiler.execution.strategy=in-process'
          exit $LASTEXITCODE

      - name: Package Minimal Zero-Trace .EXE Installer with Inno Setup
        shell: pwsh
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: |
          $number = [int]$env:BUILD_NUMBER
          $base = [int]$env:VERSION_BASE_RUN
          $appVer = if ($number -ge $base) { "$env:VERSION_LINE.$($number - $base)" } else { "2.0.$number" }
          if ($env:GITHUB_REF.StartsWith("refs/tags/v")) {
            $appVer = $env:GITHUB_REF.Substring(11)
          }
          iscc.exe "/DMyAppVersion=$appVer" installer\windows-installer.iss

      - name: Upload Windows EXE Installer Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Parchment-Windows-EXE-Installer
          path: build/installer/Parchment-Windows-x64-Setup.exe
          if-no-files-found: error

  publish-github-release:
    name: Publish OTA Release Assets (.APK & .EXE)
    needs: [build-android-apk, build-windows-exe]
    # A skipped job skips its dependents unless the condition says otherwise.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.build-windows-exe.result == 'success' && (needs.build-android-apk.result == 'success' || (inputs.reuse_android_run && needs.build-android-apk.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Determine Release Tag
        id: rel
        env:
          BUILD_NUMBER: ${{ needs.build-windows-exe.outputs.build_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            if (( BUILD_NUMBER >= VERSION_BASE_RUN )); then
              TAG="v$VERSION_LINE.$((BUILD_NUMBER - VERSION_BASE_RUN))"
            else
              TAG="v2.0.$BUILD_NUMBER"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download Android APK Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Parchment-Android-APK
          path: release-assets
          run-id: ${{ inputs.reuse_android_run || github.run_id }}
          github-token: ${{ inputs.reuse_android_run && github.token || '' }}

      - name: Download Windows EXE Installer Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Parchment-Windows-EXE-Installer
          path: release-assets

      - name: Checkout Changelog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
          path: source

      # Release notes are the changelog's Unreleased section; SHA256SUMS.txt lets anyone check a download.
      - name: Prepare Release Notes and Checksums
        run: |
          awk '/^## Unreleased/{on=1; next} /^## /{on=0} on' source/CHANGELOG.md > notes.md
          [[ -s notes.md ]] || echo "See CHANGELOG.md." > notes.md
          {
            echo
            echo "Android releases use a private signing identity. Legacy installations signed with the exposed repository key require an explicit backup/export and migration before installation."
            echo "See the [release-signing and migration guide](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/RELEASE_SIGNING.md). Installs already using the private identity can update normally."
            echo
            echo "Check a download with \`sha256sum -c SHA256SUMS.txt\` (or \`Get-FileHash\` on Windows)."
          } >> notes.md
          (cd release-assets && sha256sum Parchment-* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Create or Update GitHub Release for In-App OTA Updater
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.tag }}
          body_path: notes.md
          files: |
            release-assets/Parchment-Android-Universal.apk
            release-assets/Parchment-Android-R8-mapping.txt
            release-assets/Parchment-SBOM.cdx.json
            release-assets/Parchment-Windows-x64-Setup.exe
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: false
          generate_release_notes: true
